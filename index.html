<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Pesonize Online</title>

<body>
<!-- Keep your existing HTML structure here -->

<script>
// ═══ CONFIGURATION ═════════════════════════════════════════════
const SUPABASE_URL = 'https://YOUR_PROJECT_ID.supabase.co';
const SUPABASE_KEY = 'YOUR_ANON_KEY';

const headers = {
    'apikey': SUPABASE_KEY,
    'Authorization': `Bearer ${SUPABASE_KEY}`,
    'Content-Type': 'application/json',
    'Prefer': 'return=representation'
};

// ═══ API WRAPPERS (Replaces IndexedDB) ════════════════════════
async function fetchAll(table) {
    try {
        const res = await fetch(`${SUPABASE_URL}/rest/v1/${table}?select=*`, { headers });
        return await res.json();
    } catch (e) { console.error(e); return []; }
}

async function upsertRecord(table, data) {
    const res = await fetch(`${SUPABASE_URL}/rest/v1/${table}`, {
        method: 'POST',
        headers: { ...headers, 'Prefer': 'resolution=merge-duplicates' },
        body: JSON.stringify(data)
    });
    return res.ok;
}

async function deleteRecord(table, id) {
    const res = await fetch(`${SUPABASE_URL}/rest/v1/${table}?id=eq.${id}`, {
        method: 'DELETE',
        headers
    });
    return res.ok;
}

// ═══ APP LOGIC ════════════════════════════════════════════════
let accounts = [];

// Refactored to fetch from network
async function renderAccountsView() {
    const container = document.getElementById('accounts-content');
    container.innerHTML = '<div class="loading"><div class="spin"></div>Fetching...</div>';
    
    accounts = await fetchAll('accounts');
    
    if (accounts.length === 0) {
        container.innerHTML = `<div class="empty">No accounts found.</div>`;
        return;
    }
    
    container.innerHTML = accounts.map(acc => `
        <div class="acc-card" onclick="openEditAccount('${acc.id}')">
            <div>${acc.emoji} ${acc.name}</div>
            <div>${acc.balance}</div>
        </div>
    `).join('');
}

async function submitAccount() {
    const acc = {
        id: editingAccountId || 'ACC-' + Date.now(),
        name: document.getElementById('acc-name').value,
        type: selectedAccType,
        emoji: selectedAccEmoji,
        balance: parseFloat(document.getElementById('acc-balance').value) || 0
    };

    const success = await upsertRecord('accounts', acc);
    if (success) {
        closeModal('modal-account');
        renderAccountsView();
    }
}

// Initial Boot
window.addEventListener('DOMContentLoaded', () => {
    renderAccountsView();
});
</script>
</body>
</html>
